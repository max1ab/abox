[package]
name = "agent-mail"
version = "0.1.0"
edition = "2024"
description = "Agent directory and bulletin board built alongside agmsg"

[dependencies]
base64 = "0.22"
ring = "0.17"
libc = "0.2"
shlex = "2"
clap = { version = "4.6.7", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "time", "sync", "io-util"] }
uuid = { version = "1", features = ["v4", "v7"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3.27.0"
